name: build-arm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig + cargo-zigbuild
        run: |
          sudo apt-get update && sudo apt-get install -y zig
          cargo install cargo-zigbuild --locked
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: armd-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/armd
