[package]
name = "armd"
version = "0.1.0"
edition = "2021"
description = "Dynamixel arm daemon: sole owner of the serial bus, exposes RPC + pub/sub over a Unix socket"

[dependencies]
serialport = "4.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "armd"
path = "src/main.rs"
